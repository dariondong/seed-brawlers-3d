name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 同步共享引擎到 public/engine，并确保二者一致（不一致则构建失败）。
      - name: Sync engine into public/
        run: |
          node scripts/sync-engine.mjs
          node scripts/sync-engine.mjs --check

      - name: Run tests
        run: npm test

      # 若 Pages 已开启则继续部署；未开启时仅告警，不让整个流水线变红。
      # 首次需在 Settings → Pages → Source 选择 "GitHub Actions" 开启一次。
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Hint when Pages is not enabled
        if: steps.pages.outcome != 'success'
        run: echo "::warning::Pages 尚未开启，已跳过部署。请在 Settings → Pages → Source 选择 'GitHub Actions' 后重跑本工作流。"

      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
